<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wheelie eBike Game</title>
<style>
  body {
    margin: 0;
    background: #1a1a18;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  #wrap { position: relative; width: 100%; max-width: 640px; }
  #hud { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  #hud .label { font-size: 14px; color: #999; }
  #scoreOut { font-size: 24px; font-weight: 600; }
  #bestOut { font-weight: 600; color: #fff; }
  canvas {
    width: 100%;
    display: block;
    background: #232320;
    border-radius: 8px;
    border: 1px solid #333;
    touch-action: none;
  }
  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
  .hint { font-size: 12px; color: #777; }
  button {
    background: transparent;
    border: 1px solid #555;
    color: #fff;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #2a2a28; }
  button:active { transform: scale(0.98); }
  #overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    border-radius: 8px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }
  #overlay .card {
    background: #2a2a28;
    border-radius: 12px;
    border: 1px solid #444;
    padding: 20px 24px;
    text-align: center;
  }
  #overText { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  #overDist { font-size: 13px; color: #aaa; margin: 0 0 12px; }
</style>
</head>
<body>

<div id="wrap">
  <div id="hud">
    <div class="label">distance</div>
    <div id="scoreOut">0m</div>
    <div class="label">best <span id="bestOut">0m</span></div>
  </div>

  <canvas id="cv" width="640" height="280"></canvas>

  <div class="controls">
    <div class="hint">space = lift wheel &middot; up arrow = bunny hop</div>
    <div style="display:flex; gap:8px;">
      <button id="hopBtn">hop</button>
      <button id="holdBtn">hold to lift</button>
    </div>
  </div>

  <div id="overlay">
    <div class="card">
      <p id="overText">crashed</p>
      <p id="overDist">distance: 0m</p>
      <button id="restartBtn">ride again</button>
    </div>
  </div>
</div>

<script>
(function(){
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = 640, H = 280;
  var scoreOut = document.getElementById('scoreOut');
  var bestOut = document.getElementById('bestOut');
  var overlay = document.getElementById('overlay');
  var overText = document.getElementById('overText');
  var overDist = document.getElementById('overDist');
  var holdBtn = document.getElementById('holdBtn');
  var hopBtn = document.getElementById('hopBtn');
  var restartBtn = document.getElementById('restartBtn');

  var best = 0;
  var groundY = 200;
  var state;

  function reset(){
    state = {
      x: 120,
      speed: 200,
      angle: 0,
      angVel: 0,
      throttle: false,
      dist: 0,
      alive: true,
      obstacles: [],
      nextObstacleAt: 260,
      wheelieTime: 0,
      y: 0,
      vy: 0,
      airborne: false,
      hopFlash: 0
    };
    overlay.style.display = 'none';
  }

  function spawnObstacle(){
    var isRamp = Math.random() < 0.4;
    state.obstacles.push({ x: W + 40, w: isRamp ? 46 : 30, type: isRamp ? 'ramp' : 'hole', hit:false });
  }

  var last = null;
  function loop(ts){
    if(last===null) last = ts;
    var dt = Math.min((ts-last)/1000, 0.033);
    last = ts;
    if(state.alive) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt){
    var CRASHA = 68;
    var torqueUp = 170;
    var gravity = 130;
    var gravityY = 620;
    var jumpVy = -300;

    if(state.throttle){
      state.angVel += torqueUp*dt;
    } else {
      state.angVel -= gravity*dt;
    }
    state.angVel *= 0.965;
    state.angle += state.angVel*dt;
    if(state.angle < 0){ state.angle = 0; state.angVel = 0; }

    if(state.angle > CRASHA){
      crash('flipped over backward');
      return;
    }
    if(state.angle > 20 && !state.airborne) state.wheelieTime += dt;

    state.speed = 200 + Math.min(state.dist/5, 140);
    state.dist += state.speed*dt/10;

    if(state.airborne){
      state.vy += gravityY*dt;
      state.y += state.vy*dt;
      if(state.y >= 0){
        state.y = 0;
        state.vy = 0;
        state.airborne = false;
      }
    }
    if(state.hopFlash > 0) state.hopFlash -= dt;

    var groundSpeed = state.speed;
    for(var i=state.obstacles.length-1;i>=0;i--){
      var o = state.obstacles[i];
      o.x -= groundSpeed*dt;
      var bikeLeft = state.x - 4, bikeRight = state.x + 30;
      var overlap = (o.x < bikeRight && o.x+o.w > bikeLeft);
      if(overlap && !o.hit){
        if(o.type === 'ramp'){
          if(!state.airborne){
            o.hit = true;
            state.airborne = true;
            state.vy = jumpVy;
          }
        } else {
          if(!state.airborne && state.angle < 24){
            crash('front wheel caught a pothole');
            return;
          }
          o.hit = true;
        }
      }
      if(o.x < -60) state.obstacles.splice(i,1);
    }

    state.nextObstacleAt -= groundSpeed*dt;
    if(state.nextObstacleAt <= 0){
      spawnObstacle();
      state.nextObstacleAt = 170 + Math.random()*150;
    }

    scoreOut.textContent = Math.floor(state.dist)+'m';
  }

  function crash(reason){
    state.alive = false;
    var d = Math.floor(state.dist);
    if(d > best){ best = d; bestOut.textContent = best+'m'; }
    overText.textContent = reason;
    overDist.textContent = 'distance: '+d+'m';
    overlay.style.display = 'flex';
  }

  function bunnyHop(){
    if(!state || !state.alive || state.airborne) return;
    state.airborne = true;
    state.vy = -260;
    state.hopFlash = 0.35;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    ctx.strokeStyle = '#3a3a37';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, groundY+1);
    ctx.lineTo(W, groundY+1);
    ctx.stroke();

    var stripeOffset = (state.dist*10) % 40;
    ctx.strokeStyle = '#3a3a37';
    ctx.setLineDash([16,14]);
    ctx.beginPath();
    ctx.moveTo(-stripeOffset, groundY+30);
    ctx.lineTo(W, groundY+30);
    ctx.stroke();
    ctx.setLineDash([]);

    for(var i=0;i<state.obstacles.length;i++){
      var o = state.obstacles[i];
      if(o.type === 'ramp'){
        ctx.fillStyle = '#854F0B';
        ctx.beginPath();
        ctx.moveTo(o.x, groundY);
        ctx.lineTo(o.x+o.w, groundY);
        ctx.lineTo(o.x+o.w, groundY-26);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = '#712B13';
        ctx.beginPath();
        ctx.ellipse(o.x+o.w/2, groundY+3, o.w/2, 7, 0, 0, Math.PI*2);
        ctx.fill();
      }
    }

    var bx = state.x, by = groundY + state.y;
    var ang = state.angle * Math.PI/180;

    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(-ang*0.55);

    ctx.strokeStyle = '#4a90d9';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.lineTo(6, -34);
    ctx.lineTo(26, -34);
    ctx.lineTo(30, 0);
    ctx.moveTo(6, -34);
    ctx.lineTo(-2, -14);
    ctx.moveTo(-14,0);
    ctx.lineTo(4,-14);
    ctx.lineTo(30,0);
    ctx.stroke();

    ctx.fillStyle = '#042C53';
    ctx.beginPath();
    ctx.arc(-14, 0, 15, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#232320';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(30, 0);
    ctx.rotate(ang);
    ctx.translate(-30, 0);
    ctx.fillStyle = '#042C53';
    ctx.beginPath();
    ctx.arc(30, 0, 15, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#232320';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#4a90d9';
    ctx.beginPath();
    ctx.arc(0, -30, 7, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    ctx.fillStyle = '#4a90d9';
    ctx.font = '600 13px sans-serif';
    ctx.textAlign = 'center';
    if(state.hopFlash > 0){
      ctx.fillText('hop!', bx+8, by-90);
    } else if(state.airborne){
      ctx.fillText('airborne!', bx+8, by-90);
    } else if(state.angle > 20){
      ctx.fillText('wheelie!', bx+8, by-70);
    }
  }

  function setThrottle(v){
    if(!state.alive) return;
    state.throttle = v;
  }

  holdBtn.addEventListener('mousedown', function(e){ e.preventDefault(); setThrottle(true); });
  holdBtn.addEventListener('mouseup', function(){ setThrottle(false); });
  holdBtn.addEventListener('mouseleave', function(){ setThrottle(false); });
  holdBtn.addEventListener('touchstart', function(e){ e.preventDefault(); setThrottle(true); });
  holdBtn.addEventListener('touchend', function(e){ e.preventDefault(); setThrottle(false); });

  hopBtn.addEventListener('click', function(){ bunnyHop(); });
  hopBtn.addEventListener('touchstart', function(e){ e.preventDefault(); bunnyHop(); });

  window.addEventListener('keydown', function(e){
    if(e.code==='Space'){ e.preventDefault(); setThrottle(true); }
    if(e.code==='ArrowUp'){ e.preventDefault(); if(!e.repeat) bunnyHop(); }
  });
  window.addEventListener('keyup', function(e){
    if(e.code==='Space'){ e.preventDefault(); setThrottle(false); }
  });

  restartBtn.addEventListener('click', function(){ reset(); });

  reset();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
